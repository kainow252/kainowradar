<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1B2A"/>
      <stop offset="100%" stop-color="#1a1a3e"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#pg)" rx="20"/>
  <!-- "P" grande ciano -->
  <text x="62" y="148" font-family="Arial Black,sans-serif" font-size="130" font-weight="900" fill="#00CFFF" text-anchor="middle">P</text>
  <!-- "ichau" ao lado -->
  <text x="148" y="130" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">ichau</text>
  <!-- linha ciano embaixo -->
  <rect x="20" y="168" width="160" height="6" rx="3" fill="#00CFFF"/>
</svg>
